name: Cygwin CI

on:
  schedule:
    - cron: "0 2 * * 1"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cygwin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Cygwin x86_64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Cygwin and build dependencies
        uses: cygwin/cygwin-install-action@v6
        with:
          install-dir: D:\cygwin
          packages: |
            autoconf
            automake
            gcc-core
            git
            intltool
            libgc-devel
            libgmp-devel
            libgtk3-devel
            libev-devel
            libjson-c-devel
            libjansson-devel
            docbook-utils
            libgdbm-devel
            libtool
            make
            pkg-config

      - name: Build ATS1 and ATS2
        shell: pwsh
        run: |
          $cygwinRoot = 'D:\cygwin\bin'
          $workspace = & "$cygwinRoot\cygpath.exe" -u $env:GITHUB_WORKSPACE
          & "$cygwinRoot\bash.exe" --login -eo pipefail -o igncr "$workspace/.github/workflows/ci/cygwin-build.sh"

      - name: Prefer Windows Git for checkout cleanup
        if: always()
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\cmd'
