name: Scheduled CI

on:
  # Run weekly; manual dispatch is useful when checking a CI-only fix.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and regression tests (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ATSVER: 0.2.12
      PATSHOME: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            docbook-utils \
            libev-dev \
            libgc-dev \
            libgdbm-dev \
            libgmp-dev \
            libgtk-3-dev \
            libjansson-dev \
            libjson-c-dev

      - name: Set up ATS environment
        run: |
          echo "ATSHOME=$HOME/ats-lang-anairiats-${ATSVER}" >> "$GITHUB_ENV"
          echo "ATSHOMERELOC=ATS-${ATSVER}" >> "$GITHUB_ENV"
          echo "PATSHOMERELOC=$HOME/ATS-Postiats-contrib" >> "$GITHUB_ENV"
          echo "$PATSHOME/bin" >> "$GITHUB_PATH"
          git clone https://github.com/githwxi/ATS-Postiats-contrib.git "$HOME/ATS-Postiats-contrib"

      - name: Install and build ATS1
        run: |
          ./travis-ci/install-ats1.sh "$ATSVER"
          cd "$ATSHOME"
          ./configure
          make CC=gcc all_ngc

      - name: Build ATS2
        run: make -f Makefile_devl CC=gcc all

      - name: Build release artifacts
        run: |
          make -C src CBOOTgmp
          make -C src/CBOOT/prelude
          make -C src/CBOOT/libc
          make -C src/CBOOT/libats
          make -C doc/DISTRIB -f Makefile atspackaging
          make -C doc/DISTRIB -f Makefile atspacktarzvcf_gmp

      - name: Run documentation regression tests
        run: |
          make -C doc -f Makefile_test testall > testall_doc.log 2>&1 || {
            tail -100 testall_doc.log
            exit 1
          }
          tail -100 testall_doc.log

      - name: Build ATS utilities
        run: |
          cp "$ATSHOME/config.h" .
          make -C src cleanall
          make -C src/CBOOT/libc
          make -C src/CBOOT/libats
          make -C src/CBOOT/prelude
          make -C utils/libatsopt build
          cp -f utils/libatsopt/BUILD/libatsopt.a "$ATSHOME/ccomp/lib"
          make -C utils/libatsynmark build
          cp -f utils/libatsynmark/BUILD/libatsynmark.a "$ATSHOME/ccomp/lib"
          make -C utils/atsynmark

      - name: Build books
        run: |
          make -C doc/BOOK/ATS2TUTORIAL
          make -C doc/BOOK/INT2PROGINATS
