clone_folder: C:\projects\ATS-Postiats

image: Visual Studio 2022

platform: x64

environment:
    CYG_MIRROR: https://mirrors.kernel.org/sourceware/cygwin/
    CYG_ROOT: C:/cygwin64
    CYG_CACHE: C:/cygwin64/var/cache/setup
    CYG_SH: C:/cygwin64/bin/bash -lc
    CYG_PATH: C:/cygwin64/bin/cygpath -u
    ATS1PACK: ats-lang-anairiats-0.2.12
    ATS1PACKTGZ: ats-lang-anairiats-0.2.12.tgz
    ATSHOMERELOC: ATS-0.2.12
    PATSCONTRIBURL: https://github.com/githwxi/ATS-Postiats-contrib.git

cache:
    - '%CYG_CACHE%'

init:
    - git config --global core.symlinks true
    - git config --global core.autocrlf input
    - 'echo System architecture: %PLATFORM%'
    - 'echo Repo build branch is: %APPVEYOR_REPO_BRANCH%'
    - 'echo Build folder is: %APPVEYOR_BUILD_FOLDER%'

install:
    - 'appveyor DownloadFile https://cygwin.com/setup-x86_64.exe -FileName setup-x86_64.exe'
    - 'setup-x86_64.exe -q -n -N -d -R "%CYG_ROOT%" -s "%CYG_MIRROR%" -l "%CYG_CACHE%" -P "make,autoconf,automake,gcc-core,libtool,intltool,pkg-config,git,libgc-devel,libgmp-devel,libgtk3-devel,libev-devel,libjson-c-devel,libjansson-devel,docbook-utils,libgdbm-devel"'
    - 'FOR /F "tokens=* USEBACKQ" %%F IN (`%CYG_PATH% %APPVEYOR_BUILD_FOLDER%`) DO SET BUILD_FOLDER=%%F'
    - 'FOR /F "tokens=* USEBACKQ" %%F IN (`%CYG_PATH% %APPVEYOR_BUILD_FOLDER%/%ATS1PACK%`) DO SET ATSHOME=%%F'
    - 'FOR /F "tokens=* USEBACKQ" %%F IN (`%CYG_PATH% %APPVEYOR_BUILD_FOLDER%`) DO SET PATSHOME=%%F'
    - 'FOR /F "tokens=* USEBACKQ" %%F IN (`%CYG_PATH% %APPVEYOR_BUILD_FOLDER%/ATS-Postiats-contrib`) DO SET PATSHOMERELOC=%%F'
    - 'echo Checking the Cygwin setup'
    - '%CYG_SH% "cygcheck -dc cygwin"'

before_build:
    - 'set PATH=%PATH%;%CYG_ROOT%/bin'
    - 'echo Build ATS1 (with GC)...'
    - '%CYG_SH% "cd $BUILD_FOLDER && tar -zxf xassets/ATS1/$ATS1PACKTGZ"'
    - '%CYG_SH% "cd $BUILD_FOLDER/$ATS1PACK; exec 0</dev/null; ./configure && make ATS_PROOFCHECK=-Wno-error=implicit-function-declaration all"'
    - 'echo Download ATS2-contrib...'
    - '%CYG_SH% "cd $BUILD_FOLDER && git clone $PATSCONTRIBURL ATS-Postiats-contrib"'

build_script:
    - 'echo Cygwin root is: %CYG_ROOT%'
    - 'echo Build folder is: %APPVEYOR_BUILD_FOLDER%'
    - 'echo Repo build branch is: %APPVEYOR_REPO_BRANCH%'
    - 'echo Repo build commit is: %APPVEYOR_REPO_COMMIT%'
    - '%CYG_SH% "echo PATSHOME=$PATSHOME"'
    - 'echo Build ATS1...'
    - '%CYG_SH% "cd $ATSHOME; exec 0</dev/null; ./configure && make CC=gcc all_ngc"'
    - 'echo Build ATS2...'
    - '%CYG_SH% "cd $PATSHOME; exec 0</dev/null; make -f Makefile_devl CC=gcc all"'
    - 'echo Build ATS2 release compiler and libraries...'
    - '%CYG_SH% "cd $PATSHOME; exec 0</dev/null; make -C src CBOOTgmp"'
    - '%CYG_SH% "cd $PATSHOME; exec 0</dev/null; make -C src/CBOOT/prelude"'
    - '%CYG_SH% "cd $PATSHOME; exec 0</dev/null; make -C src/CBOOT/libc"'
    - '%CYG_SH% "cd $PATSHOME; exec 0</dev/null; make -C src/CBOOT/libats"'
    - 'echo Build ATS2 distribution packages...'
    - '%CYG_SH% "cd $PATSHOME; exec 0</dev/null; make -C doc/DISTRIB -f Makefile atspackaging"'
    - '%CYG_SH% "cd $PATSHOME; exec 0</dev/null; make -C doc/DISTRIB -f Makefile atspacktarzvcf_gmp"'
    - 'echo Run ATS2 documentation regression tests...'
    - '%CYG_SH% "cd $PATSHOME; exec 0</dev/null; make -C doc -f Makefile_test testall > testall_doc.log 2>&1; status=$?; tail -100 testall_doc.log; exit $status"'
    - 'echo Build ATS utilities...'
    - '%CYG_SH% "cd $PATSHOME; exec 0</dev/null; cp $ATSHOME/config.h . && make -C src cleanall && make -C src/CBOOT/libc && make -C src/CBOOT/libats && make -C src/CBOOT/prelude && make -C utils/libatsopt build && cp -f utils/libatsopt/BUILD/libatsopt.a $ATSHOME/ccomp/lib && make -C utils/libatsynmark build && cp -f utils/libatsynmark/BUILD/libatsynmark.a $ATSHOME/ccomp/lib && make -C utils/atsynmark"'
    - 'echo Build ATS2 books...'
    - '%CYG_SH% "cd $PATSHOME; exec 0</dev/null; make -C doc/BOOK/ATS2TUTORIAL && make -C doc/BOOK/INT2PROGINATS"'

test: off
